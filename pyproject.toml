[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "stripansi-cli"
version = "0.1.0"
description = "Remove ANSI terminal escape codes."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
[project.scripts]
stripansi-cli = "stripansi_cli.cli:main"
[tool.setuptools]
package-dir = {"" = "src"}
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
